<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ICT Trading Academy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');
  :root {
    --bg: #FAFAF7; --surface: #FFFFFF; --border: #E4E1D8; --ink: #1B1D1F;
    --ink-soft: #5B5F63; --panel: #F6F5F0; --primary: #2F4FD1; --primary-soft: #EEF1FD;
    --bull: #1E8E5A; --bear: #C23B3B; --gold: #C77F17; --mistake-bg: #FBF2E4; --mistake-border: #EED9AE;
  }
  body.dark {
    --bg: #14161A; --surface: #1D2026; --border: #2C2F36; --ink: #F2F1EC;
    --ink-soft: #A9ACB3; --panel: #22252B; --primary-soft: #202A4A; --mistake-bg: #2E2716; --mistake-border: #4A3B1E;
  }
  * { box-sizing: border-box; font-family: 'Atkinson Hyperlegible', sans-serif; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); }
  body.text-large .app { zoom: 1.18; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.5; }
  input, select, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--ink); }
  label { font-size: 12.5px; font-weight: 700; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .header { padding: 20px 24px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .brand-row { display: flex; align-items: baseline; gap: 8px; }
  .brand-mark { background: var(--primary); color: #fff; font-weight: 700; font-size: 13px; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.5px; }
  .brand-name { font-weight: 700; font-size: 19px; }
  .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .progress-track { width: 160px; height: 6px; background: var(--panel); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; }
  .progress-label { font-size: 13px; color: var(--ink-soft); }
  .header-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .mode-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .mode-btn { padding: 8px 14px; background: var(--surface); border: none; font-size: 13px; color: var(--ink-soft); }
  .mode-btn.active { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
  .icon-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; }

  .nav { display: flex; gap: 4px; padding: 10px 24px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .nav-btn { padding: 7px 12px; background: transparent; border: none; font-size: 13.5px; color: var(--ink-soft); border-radius: 6px; }
  .nav-btn.active { background: var(--ink); color: var(--bg); font-weight: 700; }
  .nav-btn.locked-nav { opacity: 0.5; }

  .main { flex: 1; padding: 24px; max-width: 760px; width: 100%; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { font-size: 18px; margin: 18px 0 8px; }
  .muted { color: var(--ink-soft); line-height: 1.5; margin: 0 0 18px; }

  .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .level-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; position: relative; }
  .level-card.locked { background: var(--panel); color: var(--ink-soft); cursor: default; }
  .level-num { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .level-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .level-tagline { font-size: 13px; color: var(--ink-soft); }
  .status-dot-row { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); margin-top: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .back-btn { background: none; border: none; color: var(--primary); font-size: 14px; padding: 0; margin-bottom: 16px; font-weight: 700; display: block; }

  .concept-card { border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 16px; background: var(--surface); }
  .concept-term { margin: 0 0 8px; font-size: 18px; }
  .concept-body { margin: 0 0 10px; line-height: 1.55; }
  .easier-btn { background: none; border: 1px solid var(--primary); color: var(--primary); border-radius: 6px; padding: 6px 12px; font-size: 13px; margin-bottom: 12px; }
  .easier-box { background: var(--primary-soft); border-radius: 6px; padding: 12px; margin-bottom: 12px; font-size: 14px; }
  .easier-label { font-weight: 700; font-size: 12px; color: var(--primary); margin-bottom: 4px; }
  .sub-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .sub-box { background: var(--panel); border-radius: 6px; padding: 10px; }
  .sub-label { font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-bottom: 4px; }
  .sub-text { font-size: 13.5px; margin: 0; line-height: 1.45; }
  .mistake-box { background: var(--mistake-bg); border-radius: 6px; padding: 10px; border: 1px solid var(--mistake-border); }
  .mistake-label { font-size: 11px; font-weight: 700; color: #8A4B12; margin-bottom: 4px; }

  .interactive-box { border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 16px; background: var(--surface); }
  .interactive-title { font-weight: 700; margin-bottom: 10px; font-size: 14px; }
  .readout { margin-top: 10px; font-size: 14px; min-height: 20px; }
  .row-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .small-btn { background: var(--primary); color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13.5px; }
  .small-btn-ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-size: 13.5px; }
  .primary-btn { background: var(--ink); color: var(--bg); border: none; border-radius: 6px; padding: 12px 20px; font-size: 15px; font-weight: 700; margin-top: 8px; }

  .quiz-wrap { border: 1px solid var(--border); border-radius: 8px; padding: 20px; background: var(--surface); }
  .quiz-progress { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
  .quiz-option { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 14.5px; background: var(--surface); color: var(--ink); }
  .quiz-option.correct { background: rgba(30,142,90,0.15); border-color: var(--bull); }
  .quiz-option.incorrect { background: rgba(194,59,59,0.15); border-color: var(--bear); }
  .quiz-explain { background: var(--panel); border-radius: 6px; padding: 12px; font-size: 14px; margin: 10px 0; line-height: 1.5; }

  .result-box { border: 1px solid var(--border); border-radius: 8px; padding: 22px; background: var(--surface); }

  .flash-outer { border: 1px solid var(--border); border-radius: 10px; padding: 40px 20px; text-align: center; background: var(--surface); cursor: pointer; min-height: 140px; display: flex; flex-direction: column; justify-content: center; }
  .flash-label { font-size: 12px; color: var(--ink-soft); font-weight: 700; margin-bottom: 10px; }
  .flash-text { font-size: 20px; font-weight: 700; line-height: 1.4; }

  .footer { text-align: center; padding: 16px; font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--border); }

  .dict-search { width: 100%; padding: 12px 14px; font-size: 15px; margin-bottom: 16px; }
  .dict-entry { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface); }
  .dict-cat { font-size: 11px; color: var(--primary); font-weight: 700; margin-bottom: 4px; }
  .dict-term { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .dict-def { font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }

  table.session-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
  table.session-table th, table.session-table td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); }
  table.session-table th { color: var(--ink-soft); font-size: 11.5px; text-transform: none; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 700; }
  .pill.open { background: rgba(30,142,90,0.15); color: var(--bull); }
  .pill.closed { background: var(--panel); color: var(--ink-soft); }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-field { display: flex; flex-direction: column; }
  .form-field input, .form-field select, .form-field textarea { width: 100%; }
  .journal-entry { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 10px; background: var(--surface); font-size: 13.5px; }
  .journal-entry .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat-card { background: var(--panel); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-num { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 11.5px; color: var(--ink-soft); }

  .step-card { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; background: var(--surface); }
  .step-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .step-num { width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-title { font-weight: 700; font-size: 15px; }
  .step-why { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }

  .table-ref { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-bottom: 16px; }
  .table-ref th, .table-ref td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); }
  .table-ref th { color: var(--ink-soft); font-size: 11.5px; }

  .settings-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ===========================================================
   ICT Trading Academy — full build (vanilla JS, single file)
=========================================================== */

const LEVELS = [
  { id: 0,  title: "Trading Basics", tagline: "What trading even is" },
  { id: 1,  title: "Reading Candles", tagline: "One candle at a time" },
  { id: 2,  title: "Timeframes", tagline: "Zooming in and out" },
  { id: 3,  title: "Market Structure", tagline: "Highs, lows, and trend" },
  { id: 4,  title: "Liquidity", tagline: "Where orders cluster" },
  { id: 5,  title: "Fair Value Gaps", tagline: "Gaps candles leave behind" },
  { id: 6,  title: "Order Blocks", tagline: "Where big moves start" },
  { id: 7,  title: "Premium & Discount", tagline: "Expensive vs. cheap" },
  { id: 8,  title: "Time & Sessions", tagline: "The market's clock" },
  { id: 9,  title: "ICT Kill Zones", tagline: "Windows worth watching" },
  { id: 10, title: "Daily & Weekly Context", tagline: "Yesterday's map" },
  { id: 11, title: "Multi-Timeframe Analysis", tagline: "Reading top to bottom" },
  { id: 12, title: "The ICT 2022 Model", tagline: "Putting it all together" },
];

const CONCEPTS = {
  0: [
    { term: "Market", normal: "A market is a place — usually digital now — where people buy and sell things, like company shares, currencies, or contracts.", simple: "A market is where buying and selling happens.", easier: "Think of a farmer's market, but instead of vegetables, people trade money, shares, and contracts.", example: "The stock market is where shares of companies like Apple are bought and sold.", lookFor: "Every market has a price that moves because people are buying and selling.", mistake: "Thinking 'the market' is one single place — it's really thousands of buyers and sellers agreeing on a price." },
    { term: "Bid, Ask & Spread", normal: "The bid is the highest price a buyer will pay. The ask is the lowest price a seller will accept. The spread is the gap between them.", simple: "Bid = what buyers offer. Ask = what sellers want. Spread = the small gap between the two.", easier: "It's like a garage sale: you offer $5 (bid), the seller wants $7 (ask). The $2 gap is the spread.", example: "If the bid is $100.00 and the ask is $100.02, the spread is $0.02.", lookFor: "A tighter spread usually means it's cheaper and easier to trade that market.", mistake: "Forgetting the spread is a small cost every time you enter and exit a trade." },
    { term: "Long vs. Short", normal: "Going long means buying first, hoping the price rises so you can sell later for more. Going short means selling first (often borrowed), hoping the price falls so you can buy it back cheaper.", simple: "Long = betting price goes up. Short = betting price goes down.", easier: "Long is like buying a house hoping it's worth more later. Short is more unusual: it's like selling something you borrowed, planning to buy it back cheaper.", example: "If you go long at $50 and price rises to $60, you gained $10 per unit.", lookFor: "Ask yourself: am I expecting price to go up (long) or down (short)?", mistake: "Assuming you can only make money when prices rise — shorting exists for falling prices too." },
    { term: "Stop Loss & Take Profit", normal: "A stop loss automatically closes a losing trade at a price you choose, to limit how much you can lose. A take profit automatically closes a winning trade at a price you choose, to lock in gains.", simple: "Stop loss = your 'exit if I'm wrong' price. Take profit = your 'exit if I'm right' price.", easier: "It's like setting a timer before you start something risky — one timer says 'stop if this goes badly,' the other says 'stop, I got what I wanted.'", example: "You buy at $100, set a stop loss at $95 and a take profit at $115.", lookFor: "A trade plan should have both defined before you ever enter.", mistake: "Entering a trade without deciding your stop loss first — this is one of the most common beginner mistakes." },
    { term: "Risk / Reward", normal: "Risk/reward compares how much you could lose to how much you could gain on a trade, usually written like 1:2 or 1:3.", simple: "It answers: 'if I'm wrong, how much do I lose — and if I'm right, how much do I gain?'", easier: "Would you risk $1 to possibly win $3? That's a 1:3 risk/reward — a good deal even if you're wrong sometimes.", example: "Risking $50 to potentially make $150 is a risk/reward ratio of 1:3.", lookFor: "A good risk/reward ratio can still lose money overall if used carelessly — it's one factor, not a guarantee.", mistake: "Believing a good risk/reward ratio means a trade is guaranteed to work out." },
    { term: "Leverage", normal: "Leverage lets you control a larger position than your own money would normally allow, by effectively borrowing the rest. It multiplies both gains and losses.", simple: "Leverage = trading 'bigger' than your own money, which makes wins bigger and losses bigger too.", easier: "Imagine lifting a heavy box with a lever — it's easier to move, but if it swings the wrong way, it swings harder too.", example: "With 10x leverage, a 1% price move changes your position value by about 10%.", lookFor: "Higher leverage means smaller price moves can wipe out more of your account.", mistake: "Using high leverage without adjusting position size — this is a leading cause of large, fast losses." },
  ],
  1: [
    { term: "Open, High, Low, Close (OHLC)", normal: "Every candle records four prices for its time period: the Open (first price), High (highest price), Low (lowest price), and Close (last price).", simple: "Each candle stores 4 numbers: where it started, its highest point, its lowest point, and where it ended.", easier: "Think of a candle as a tiny diary entry for a chunk of time: 'I started here, went up to here, dipped down to here, and ended here.'", example: "A 1-hour candle with open 100, high 108, low 98, close 104 tells you the full story of that hour.", lookFor: "The close relative to the open tells you the candle's overall direction.", mistake: "Only looking at the close and ignoring the high/low — the wick often matters just as much." },
    { term: "Bullish vs. Bearish Candle", normal: "A bullish candle closes higher than it opened (price rose). A bearish candle closes lower than it opened (price fell). Color usually shows this at a glance.", simple: "Bullish = closed higher (usually green). Bearish = closed lower (usually red).", easier: "Green candle: price won the round. Red candle: price lost the round.", example: "Open 100, close 106 → bullish. Open 100, close 94 → bearish.", lookFor: "A string of bullish candles in a row often signals buyers are in control for now.", mistake: "Assuming one bullish candle means the price will keep rising — a single candle is not a trend." },
    { term: "Wick vs. Body", normal: "The body is the thick part between open and close. The wicks (or shadows) are the thin lines above and below showing the full high-to-low range.", simple: "Body = open to close. Wick = the thin lines showing the extremes reached.", easier: "The body is the 'main story.' The wicks are like footnotes showing how far price wandered before settling down.", example: "A long lower wick means price dropped sharply, then recovered before the candle closed.", lookFor: "Long wicks can show rejection — price tried to go somewhere and got pushed back.", mistake: "Ignoring wicks entirely and only reading the body." },
    { term: "Timeframe", normal: "A timeframe is how much real time one candle represents — for example, 1 minute, 15 minutes, 1 hour, or 1 day.", simple: "Timeframe = how much time is packed into one candle.", easier: "A daily candle is like a whole day summarized in one shape. A 1-minute candle is like a single sentence from that day.", example: "On a 1-hour chart, each candle summarizes 60 minutes of price action.", lookFor: "Higher timeframes (daily, 4-hour) tend to show broader context; lower timeframes show more detail and more noise.", mistake: "Trying to read a 1-minute chart before understanding the bigger picture on a higher timeframe." },
  ],
  2: [
    { term: "Common Timeframes", normal: "Charts are commonly viewed at a ladder of timeframes: 1-minute, 5-minute, 15-minute, 30-minute, 1-hour, 4-hour, Daily, and Weekly.", simple: "There's a whole ladder of timeframes, from 1-minute up to Weekly.", easier: "Think of a zoom slider on a map — 1-minute is zoomed all the way into a single street, Weekly is zoomed out to see the whole country.", example: "A trader might check the Daily chart, then zoom into the 15-minute chart of the same market.", lookFor: "Each rung on the ladder shows the same market at a different level of detail.", mistake: "Assuming there's only one 'correct' timeframe to trade — different timeframes suit different goals." },
    { term: "Higher Timeframe vs. Lower Timeframe", normal: "A higher timeframe (like Daily or 4-hour) is generally used for broader context. A lower timeframe (like 15-minute or 5-minute) is generally used for more detailed timing.", simple: "Higher timeframe = big picture. Lower timeframe = fine detail.", easier: "The higher timeframe is like reading the table of contents of a book. The lower timeframe is like reading one specific paragraph closely.", example: "A trader might use the 4-hour chart to see the overall trend, then the 5-minute chart to time an entry within that trend.", lookFor: "Context from a higher timeframe can help make sense of what's happening on a lower one.", mistake: "Reading only a low timeframe chart with no higher timeframe context at all." },
    { term: "Same Market, Different Story", normal: "The exact same hours of trading can look calm on a higher timeframe chart and look busy or chaotic on a lower timeframe chart of the same period.", simple: "The same 3 hours of trading can look totally different depending on which timeframe you view it on.", easier: "It's like watching a sports game highlight reel versus watching every single second of the game — same event, very different amount of detail.", example: "A single 4-hour candle might contain dozens of separate 5-minute candles, each with their own ups and downs.", lookFor: "If a lower timeframe feels chaotic, zooming out to a higher timeframe can help make sense of it.", mistake: "Judging a market as 'crazy' or 'broken' just because a low timeframe looks messy." },
    { term: "A Simple Top-Down Framework (Example Only)", normal: "One common example framework is: Daily and 4-hour charts for broader context, 1-hour and 15-minute for setup context, and 5-minute or 1-minute for detailed execution.", simple: "One example: big timeframes = context, medium timeframes = setup, small timeframes = execution.", easier: "Like planning a road trip: the map (Daily/4H) shows the route, the GPS directions (1H/15M) show the next turns, and glancing at the road (5M/1M) is for the final moment of steering.", example: "Daily shows an uptrend, 1H shows price near a key level, 5M is used just to time the entry.", lookFor: "This is one example structure, not a rule that applies to every trader or every market.", mistake: "Treating this specific timeframe combination as a mandatory, universal rule." },
  ],
  3: [
    { term: "Swing High & Swing Low", normal: "A swing high is a candle's high point that is higher than the candles immediately around it. A swing low is a low point that is lower than the candles immediately around it.", simple: "Swing high = a clear peak. Swing low = a clear dip.", easier: "Picture a mountain range from far away — the tips of the peaks are swing highs, the bottoms of the valleys are swing lows.", example: "If price rises, then pulls back, then rises again, the top of that first rise is a swing high.", lookFor: "Swing points are the building blocks for reading trend and structure.", mistake: "Marking every small wiggle as a swing point instead of the clear, obvious ones." },
    { term: "Higher Highs / Higher Lows (Trend)", normal: "A series of higher highs and higher lows generally describes an uptrend. Lower highs and lower lows generally describe a downtrend.", simple: "Peaks and dips both climbing = uptrend. Peaks and dips both falling = downtrend.", easier: "Uptrend is like climbing stairs — each step (and each landing) is higher than the last.", example: "Swing lows at 100, then 105, then 110 — each low is higher than the last, suggesting an uptrend.", lookFor: "A trend is a pattern across several swing points, not just one.", mistake: "Calling a trend after seeing just one higher high, without a higher low to confirm it." },
    { term: "Break of Structure (BOS)", normal: "A break of structure happens when price closes beyond a prior swing high (in an uptrend) or swing low (in a downtrend), suggesting the existing trend is continuing.", simple: "BOS = price breaks past the last important peak or dip, in the direction it was already going.", easier: "If someone kept beating their own personal best in a race, each new record is like a 'break of structure' in their favor.", example: "In an uptrend, price closing above the last swing high is a bullish break of structure.", lookFor: "A break of structure is often used as a clue that the current trend is still active.", mistake: "Confusing a break of structure (trend continuing) with a market structure shift (trend possibly reversing)." },
    { term: "Market Structure Shift (MSS)", normal: "A market structure shift happens when price breaks structure in the opposite direction of the current trend, suggesting the trend may be changing.", simple: "MSS = a clue the trend might be flipping.", easier: "If someone walking north suddenly turns and starts walking south, that turn is like an MSS.", example: "In a downtrend, price breaking above a recent swing high could be an early sign of a market structure shift.", lookFor: "An MSS is a signal to pay closer attention, not proof the trend has reversed for good.", mistake: "Treating every small structure shift as a guaranteed full reversal." },
  ],
  4: [
    { term: "Liquidity", normal: "Liquidity refers to clusters of resting orders — like stop losses and pending orders — that tend to build up around obvious price levels.", simple: "Liquidity = a pool of orders sitting around obvious price levels.", easier: "Imagine a pool of orders sitting just above a recent high, like puddles collecting at the bottom of a hill. Price sometimes 'drains' through them.", example: "Many traders place stop losses just above a recent high — that cluster of orders is liquidity.", lookFor: "Obvious, easy-to-spot highs and lows are exactly where liquidity tends to build up.", mistake: "Assuming liquidity is a signal by itself — it only matters in how price reacts around it." },
    { term: "Buy-Side & Sell-Side Liquidity (BSL/SSL)", normal: "Buy-side liquidity (BSL) tends to sit above recent highs. Sell-side liquidity (SSL) tends to sit below recent lows.", simple: "BSL = above recent highs. SSL = below recent lows.", easier: "Highs act like a ceiling with orders resting just above it (BSL). Lows act like a floor with orders resting just below it (SSL).", example: "A recent swing high often has buy-side liquidity resting just above it.", lookFor: "Ask: where are the obvious highs and lows that other traders would also notice?", mistake: "Only ever looking for liquidity above price and forgetting to check below, or vice versa." },
    { term: "Equal Highs / Equal Lows", normal: "When price touches the same high (or low) more than once, it creates equal highs (or lows) — an especially obvious liquidity magnet.", simple: "Equal highs/lows = the same level touched more than once.", easier: "It's like two arrows landing on the exact same spot on a dartboard — that spot stands out.", example: "If price touches 150 twice without breaking through, those are equal highs.", lookFor: "Equal highs/lows are some of the easiest liquidity levels to spot on a chart.", mistake: "Assuming equal highs must break immediately — timing still matters." },
    { term: "Liquidity Sweep", normal: "A liquidity sweep is when price briefly pushes through an obvious high or low, likely triggering orders resting there, and then potentially reverses.", simple: "A sweep is a quick push through a level to trigger orders, that may then reverse.", easier: "Like a wave that rushes just past the sandcastle line, grabs a few pebbles, then pulls back.", example: "Price spikes 5 points above a recent high, then reverses sharply — a possible liquidity sweep.", lookFor: "A sweep alone is not proof of a reversal — it's a clue to watch closely, not a signal to act alone.", mistake: "Treating every sweep as a guaranteed reversal signal — sometimes price keeps going." },

  5: [
    { term: "Fair Value Gap (FVG)", normal: "A Fair Value Gap is usually identified using three consecutive candles, where the range of the first candle and the range of the third candle don't overlap — leaving a gap.", simple: "An FVG is a small gap left behind when price moves quickly across three candles.", easier: "Imagine three people jumping across stepping stones so fast that one stone in the middle never gets touched. That untouched spot is like the FVG.", example: "If candle 1 has a high of 100 and candle 3 has a low of 104, the untouched 100–104 zone is a Fair Value Gap.", lookFor: "FVGs tend to form during fast, strong moves rather than slow, choppy ones.", mistake: "Looking for an FVG on every single candle instead of only during genuinely fast moves." },
    { term: "Bullish vs. Bearish FVG", normal: "A bullish FVG forms during a strong upward push in price. A bearish FVG forms during a strong downward push in price.", simple: "Bullish FVG = gap left during a fast move up. Bearish FVG = gap left during a fast move down.", easier: "It's labeled by which direction price was racing when it left the gap behind.", example: "Three candles rocketing higher with a gap between candle 1 and candle 3 would be a bullish FVG.", lookFor: "The direction of the FVG usually matches the direction of the move that created it.", mistake: "Mislabeling an FVG's direction by only glancing at one candle instead of all three." },
    { term: "FVG Fill & Consequent Encroachment", normal: "'Filling' an FVG means price returns and trades back through part or all of the gap. The midpoint of the gap is sometimes called consequent encroachment.", simple: "Fill = price comes back and revisits the gap. The gap's midpoint has its own name: consequent encroachment.", easier: "If the gap is a doorway price left open, 'filling' it is like walking back through that same doorway later.", example: "Price races up leaving a gap between 100–104, then days later dips back down to 102 (the midpoint) before continuing higher.", lookFor: "Some traders watch how price behaves specifically at the gap's midpoint.", mistake: "Assuming a gap must be completely filled, all at once, or not at all — partial fills happen too." },
    { term: "Inverse FVG", normal: "When price fully closes back through an FVG, some traders treat that zone as potentially flipping roles — this is a more advanced and debated interpretation.", simple: "An 'inverse FVG' is the idea that a gap can flip roles once price fully breaks back through it.", easier: "Like a door that used to only open one way suddenly swinging open the other way too.", example: "A bullish FVG that price later closes fully below might be watched as a possible resistance-like zone going forward.", lookFor: "This is one of the more subjective, debated ICT ideas — different traders apply it differently.", mistake: "Treating the inverse FVG idea as settled fact rather than one interpretation among traders." },

  6: [
    { term: "Order Block", normal: "An order block is often described as the last opposite-direction candle before a strong displacement move — used by some traders as a possible reaction zone.", simple: "An order block is roughly 'the last down candle before a big move up' (or vice versa).", easier: "Picture the last deep breath someone takes right before sprinting — the order block is like that last pause before the big move.", example: "If price prints one red candle and then rips upward for several strong green candles, that red candle may be marked as a bullish order block.", lookFor: "Order blocks are usually identified right next to a strong, fast move.", mistake: "Marking an order block after every candle instead of only near genuinely strong moves." },
    { term: "Bullish vs. Bearish Order Block", normal: "A bullish order block is typically the last down candle before a strong move up. A bearish order block is typically the last up candle before a strong move down.", simple: "Bullish OB = last down candle before a rally. Bearish OB = last up candle before a drop.", easier: "It's named for the direction of the big move that followed it, not the candle's own color.", example: "A single red candle just before five strong green candles could be labeled a bullish order block.", lookFor: "Check what happened right after the candle, not just the candle itself.", mistake: "Labeling a candle an order block just because of its color, without checking what followed." },
    { term: "Breaker & Mitigation", normal: "A breaker generally describes an order block that failed, with price breaking back through it. Mitigation refers to price returning to a previously identified order block area.", simple: "Breaker = an order block that failed. Mitigation = price coming back to visit an order block zone.", easier: "A breaker is like a fence that got knocked down — it didn't hold. Mitigation is simply price 'checking back in' on an old zone.", example: "Price breaks below a bullish order block that was expected to hold — some traders would call that block a breaker.", lookFor: "Ask whether the zone held (order block) or failed and got run through (breaker).", mistake: "Assuming every order block will always hold — order blocks fail fairly often." },
    { term: "A Note on Subjectivity", normal: "ICT terminology, including order blocks, can be interpreted differently by different traders. Using clearly defined personal rules is more useful than vague labels.", simple: "Different traders draw order blocks differently — having your own clear rules matters more than the label itself.", easier: "It's a bit like two people describing the 'best seat' in a movie theater — they might not agree, because it's partly a judgment call.", example: "One trader might mark the last down candle as the order block; another might use the last down candle with the largest range instead.", lookFor: "Whatever rule you use, apply it consistently so you can learn from your own results.", mistake: "Assuming order blocks are an exact, universally agreed-upon science rather than a somewhat subjective tool." },

  8: [
    { term: "Trading Sessions", normal: "Markets are often discussed in terms of major regional trading sessions — roughly tied to normal business hours in Sydney, Tokyo, London, and New York.", simple: "A 'session' is roughly the active trading hours tied to a major financial city.", easier: "It's a bit like time zones for a global relay race — as one city's session winds down, another one is just waking up.", example: "The New York session generally overlaps with the tail end of the London session.", lookFor: "Different sessions can have noticeably different levels of activity.", mistake: "Assuming all sessions behave identically — activity levels and behavior can vary by session." },

function statusFor(level) {

/* --------------------------- timezone helpers --------------------------- */

function tzOffsetMs(timeZone, date) {
  const dtf = new Intl.DateTimeFormat("en-US", { timeZone, hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const parts = dtf.formatToParts(date).reduce((acc, p) => { acc[p.type] = p.value; return acc; }, {});
  let hour = parts.hour === "24" ? 0 : Number(parts.hour);
  const asUTC = Date.UTC(Number(parts.year), Number(parts.month) - 1, Number(parts.day), hour, Number(parts.minute), Number(parts.second));
  return asUTC - date.getTime();
}
function todayInTz(timeZone) {
  const dtf = new Intl.DateTimeFormat("en-CA", { timeZone, year: "numeric", month: "2-digit", day: "2-digit" });
  return dtf.format(new Date());
}
function zonedWallTimeToUtc(dateStr, timeStr, timeZone) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const [hh, mm] = timeStr.split(":").map(Number);
  let guess = new Date(Date.UTC(y, m - 1, d, hh, mm, 0));
  let offset = tzOffsetMs(timeZone, guess);
  let utcInstant = guess.getTime() - offset;
  offset = tzOffsetMs(timeZone, new Date(utcInstant));
  utcInstant = guess.getTime() - offset;
  return new Date(utcInstant);
}
function formatInTz(date, timeZone) {
  return new Intl.DateTimeFormat("en-US", { timeZone, hour: "numeric", minute: "2-digit", hour12: true, month: "short", day: "numeric" }).format(date);
}

function flashRate(level) {
  const f = state.flash;
  const cardIdx = f.queue[f.pos % f.queue.length];
  const insertAt = level === "hard" ? f.pos + 3 : level === "medium" ? f.pos + 6 : f.queue.length;
  const newQueue = f.queue.slice();
  newQueue.splice(f.pos, 1);
  const clamped = Math.min(insertAt, newQueue.length);
  newQueue.splice(clamped, 0, cardIdx);
  f.queue = newQueue; f.flipped = false;
  f.pos = (f.pos + 1) % Math.max(newQueue.length, 1);
  render();
}

  const pointValue = parseFloat(state.risk.pointValue) || 0;
  const maxRiskDollars = account * (riskPct / 100);

  state.risk.result = { maxRiskDollars, suggestedSize, perContractRisk };
  render();
}

function renderCandleChart() {
  const minP = Math.min(...CANDLES.map((c) => c.l)) - 3;
  const maxP = Math.max(...CANDLES.map((c) => c.h)) + 3;
  const scaleY = (p) => 190 - ((p - minP) / (maxP - minP)) * 180;
  const width = 340;
  const gap = width / CANDLES.length;
  const svgParts = CANDLES.map((c, i) => {
    const cx = gap * i + gap / 2;
    const isUp = c.c >= c.o;
    const bodyTop = scaleY(Math.max(c.o, c.c));
    const bodyBottom = scaleY(Math.min(c.o, c.c));
    const isSel = state.candleSelected === i;
    const color = isUp ? "#1E8E5A" : "#C23B3B";
    return `<g onclick="selectCandle(${i})"><line x1="${cx}" x2="${cx}" y1="${scaleY(c.h)}" y2="${scaleY(c.l)}" stroke="${color}" stroke-width="${isSel ? 2.5 : 1.5}" /><rect x="${cx - 12}" y="${bodyTop}" width="24" height="${Math.max(bodyBottom - bodyTop, 2)}" fill="${color}" opacity="${isSel ? 1 : 0.85}" stroke="${isSel ? "#2F4FD1" : "none"}" stroke-width="2" /></g>`;
  }).join("");
  let readout = `<span style="color:var(--ink-soft)">No candle selected yet.</span>`;
  if (state.candleSelected !== null) {
    const c = CANDLES[state.candleSelected];
    const dir = c.c >= c.o ? "Bullish" : "Bearish";
    const dirColor = c.c >= c.o ? "#1E8E5A" : "#C23B3B";
    readout = `<span><strong>Candle ${state.candleSelected + 1}:</strong> Open ${c.o} · High ${c.h} · Low ${c.l} · Close ${c.c} — <strong style="color:${dirColor}">${dir}</strong></span>`;
  }
  return `<div class="interactive-box"><div class="interactive-title">Tap a candle to read its OHLC</div><svg width="100%" viewBox="0 0 ${width} 200" style="max-width:400px">${svgParts}</svg><div class="readout">${readout}</div></div>`;
}

function renderStructureChart() {
  const checked = state.structureChecked;
  const selected = state.structureSelected;
  const pointColor = (i, type) => {
    if (!checked) return selected.includes(i) ? "#2F4FD1" : type === "high" ? "#B8B4A6" : "#DCE0EA";
    const isCorrectHigh = CORRECT_HIGH_INDICES.includes(i);
    const wasSelected = selected.includes(i);
    if (isCorrectHigh && wasSelected) return "#1E8E5A";
    if (isCorrectHigh && !wasSelected) return "#C77F17";
    if (!isCorrectHigh && wasSelected) return "#C23B3B";
    return "#DCE0EA";
  };
  const pathD = STRUCTURE_POINTS.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
  const circles = STRUCTURE_POINTS.map((p, i) => {
    const isStart = p.type === "start";
    const fill = isStart ? "#C9C6BA" : pointColor(i, p.type);
    return `<circle cx="${p.x}" cy="${p.y}" r="${isStart ? 5 : 9}" fill="${fill}" stroke="#1B1D1F" stroke-width="${isStart ? 0 : 1}" ${isStart ? "" : `onclick="toggleStructurePoint(${i})"`} />`;
  }).join("");
  const allCorrect = checked && CORRECT_HIGH_INDICES.every((i) => selected.includes(i)) && selected.every((i) => CORRECT_HIGH_INDICES.includes(i));
  let feedback = "";
  if (checked) {
    feedback = allCorrect
      ? `<div class="readout"><span style="color:#1E8E5A">Exactly right — those are the swing highs.</span></div>`
      : `<div class="readout"><span style="color:#8A4B12">Not quite. Green = correct pick, gold = a swing high you missed, red = not actually a swing high.</span></div>`;
  }
  return `
    <div class="interactive-box">
      <div class="interactive-title">Click every swing high, then check your answer</div>
      <svg width="100%" viewBox="0 0 360 200" style="max-width:400px"><path d="${pathD}" fill="none" stroke="#C9C6BA" stroke-width="2" />${circles}</svg>
      <div class="row-btns">
        <button class="small-btn" onclick="checkStructure()" ${checked ? "disabled" : ""}>Check answer</button>
        ${checked ? `<button class="small-btn-ghost" onclick="retryStructure()">Try again</button>` : ""}
      </div>
      ${feedback}
    </div>
  `;
}

function renderPremiumDiscountTool() {
  if (state.pdSlider === undefined) state.pdSlider = 50;
  const low = 100, high = 120;
  const price = low + ((high - low) * state.pdSlider) / 100;
  const zone = state.pdSlider > 55 ? "Premium" : state.pdSlider < 45 ? "Discount" : "Equilibrium";
  const zoneColor = zone === "Premium" ? "#C23B3B" : zone === "Discount" ? "#1E8E5A" : "#C77F17";
  return `
    <div class="interactive-box">
      <div class="interactive-title">Drag to move price through an example 100–120 dealing range</div>
      <input type="range" min="0" max="100" value="${state.pdSlider}" oninput="movePdSlider(this.value)" style="width:100%" />
      <div class="readout">Price: <strong>${price.toFixed(1)}</strong> — Zone: <strong style="color:${zoneColor}">${zone}</strong></div>
      <div class="sub-row" style="margin-top:10px">
        <div class="sub-box"><div class="sub-label">Range high</div><p class="sub-text">120 (Premium above 110)</p></div>
        <div class="sub-box"><div class="sub-label">Range low</div><p class="sub-text">100 (Discount below 110)</p></div>

  `;
}

function renderSessionClock() {
  const now = new Date();
  const zoneOptions = DISPLAY_ZONES.map((z) => `<option value="${z.tz}" ${z.tz === state.displayTz ? "selected" : ""}>${esc(z.label)}</option>`).join("");
  const rows = SESSIONS.map((s) => {
    const dateStr = todayInTz(s.tz);
    const startUtc = zonedWallTimeToUtc(dateStr, s.start, s.tz);
    let endUtc = zonedWallTimeToUtc(dateStr, s.end, s.tz);
    if (endUtc <= startUtc) endUtc = new Date(endUtc.getTime() + 24 * 3600 * 1000);
    const isOpen = now >= startUtc && now <= endUtc;
    return `
      <tr>
        <td>${esc(s.name)}</td>
        <td>${formatInTz(startUtc, state.displayTz)}</td>
        <td>${formatInTz(endUtc, state.displayTz)}</td>
        <td><span class="pill ${isOpen ? "open" : "closed"}">${isOpen ? "Open now" : "Closed"}</span></td>
      </tr>
    `;
  }).join("");
  return `
    <h1>Session Clock</h1>
    <p class="muted">Times are converted to your selected timezone automatically, accounting for daylight saving.</p>
    <div class="form-field" style="max-width:280px;margin-bottom:16px">

      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderBacktestChart() {
  const revealed = BACKTEST_CANDLES.slice(0, state.backtest.revealed);
  const minP = Math.min(...BACKTEST_CANDLES.map((c) => c.l)) - 3;
  const maxP = Math.max(...BACKTEST_CANDLES.map((c) => c.h)) + 3;
  const scaleY = (p) => 190 - ((p - minP) / (maxP - minP)) * 180;
  const width = Math.max(340, revealed.length * 40);
  const gap = width / BACKTEST_CANDLES.length;
  const svgParts = revealed.map((c, i) => {
    const cx = gap * i + gap / 2;
    const isUp = c.c >= c.o;
    const bodyTop = scaleY(Math.max(c.o, c.c));
    const bodyBottom = scaleY(Math.min(c.o, c.c));
    const color = isUp ? "#1E8E5A" : "#C23B3B";
    const isSel = state.backtestSelected === i;
    return `<g onclick="selectBacktestCandle(${i})"><line x1="${cx}" x2="${cx}" y1="${scaleY(c.h)}" y2="${scaleY(c.l)}" stroke="${color}" stroke-width="${isSel ? 2.5 : 1.5}" /><rect x="${cx - 10}" y="${bodyTop}" width="20" height="${Math.max(bodyBottom - bodyTop, 2)}" fill="${color}" opacity="${isSel ? 1 : 0.85}" /></g>`;
  }).join("");
  let readout = `<span style="color:var(--ink-soft)">Tap a candle to read its OHLC.</span>`;
  if (state.backtestSelected !== null && state.backtestSelected < revealed.length) {
    const c = revealed[state.backtestSelected];
    readout = `<span>Open ${c.o} · High ${c.h} · Low ${c.l} · Close ${c.c}</span>`;
  }
  return `<svg width="100%" viewBox="0 0 ${width} 200" style="max-width:100%">${svgParts}</svg><div class="readout">${readout}</div>`;
}

function renderBacktest() {

      ${!isDone ? `

        <p class="muted" style="margin-top:8px">Past performance does not guarantee future results — this exercise is for practicing reading price action without seeing the future, not for predicting it.</p>

}

    <h1>Daily Practice</h1>
    <div class="quiz-wrap">
      <div class="quiz-progress">Question ${d.index + 1} of ${d.questions.length} · ${esc(q.levelTitle)}</div>
      <h3 style="margin-top:8px">${esc(q.q)}</h3>
      <div>${options}</div>
      ${d.showExplain ? `<div class="quiz-explain">${d.picked === q.correct ? "Correct. " : "Not quite. "}${esc(q.explain)}</div>` : ""}
      ${d.showExplain ? `<button class="small-btn" onclick="dailyNext()">${d.index + 1 < d.questions.length ? "Next" : "See today's score"}</button>` : ""}
    </div>
  `;
}

function renderCertIntro() {
  const mastered = state.progress[12] === "mastered";
  return `
    <h1>ICT Learning Mastery Test</h1>
    ${mastered ? `
      <p class="muted">A comprehensive test covering all 13 levels — one question from each. Score 80% or higher to complete it.</p>
      <button class="primary-btn" onclick="startCertification()">Begin the mastery test</button>
    ` : `
      <p class="muted">This test unlocks once you've mastered Level 12 (The ICT 2022 Model). Keep working through the course to get there.</p>
    `}
  `;
}
function renderCert() {
  const c = state.cert;
  if (c.done) {
    const pct = Math.round((c.score / c.questions.length) * 100);
    const byLevel = {};
    c.breakdown.forEach((b) => { byLevel[b.levelTitle] = byLevel[b.levelTitle] || { right: 0, total: 0 }; byLevel[b.levelTitle].total += 1; if (b.correct) byLevel[b.levelTitle].right += 1; });
    const strongest = Object.keys(byLevel).filter((k) => byLevel[k].right === byLevel[k].total);
    const weakest = Object.keys(byLevel).filter((k) => byLevel[k].right < byLevel[k].total);
    return `
      <div class="result-box">
        <h1>ICT Learning Mastery Test — ${pct}%</h1>
        <p class="muted">You scored ${c.score} of ${c.questions.length}. This is a learning milestone, not a professional trading certification.</p>
        ${strongest.length ? `<h2>Strongest areas</h2><p class="muted">${strongest.map(esc).join(", ")}</p>` : ""}
        ${weakest.length ? `<h2>Areas to review</h2><p class="muted">${weakest.map(esc).join(", ")}</p>` : ""}
        <button class="small-btn-ghost" onclick="startCertification()">Retake the test</button>
      </div>
    `;
  }
  const q = c.questions[c.index];
  const options = q.options.map((opt, idx) => {
    let cls = "quiz-option";
    if (c.showExplain) { if (idx === q.correct) cls += " correct"; else if (idx === c.picked) cls += " incorrect"; }
    return `<button class="${cls}" onclick="certChoose(${idx})">${esc(opt)}</button>`;
  }).join("");
  return `
    <h1>ICT Learning Mastery Test</h1>
    <div class="quiz-wrap">
      <div class="quiz-progress">Question ${c.index + 1} of ${c.questions.length} · ${esc(q.levelTitle)}</div>
      <h3 style="margin-top:8px">${esc(q.q)}</h3>
      <div>${options}</div>
      ${c.showExplain ? `<div class="quiz-explain">${c.picked === q.correct ? "Correct. " : "Not quite. "}${esc(q.explain)}</div>` : ""}
      ${c.showExplain ? `<button class="small-btn" onclick="certNext()">${c.index + 1 < c.questions.length ? "Next" : "See results"}</button>` : ""}
    </div>
  `;
}

function renderSettings() {
  return `
    <h1>Settings</h1>
    <div class="settings-row"><span>Dark mode</span><button class="icon-btn" onclick="toggleDark(); render()">${state.dark ? "On" : "Off"}</button></div>
    <div class="settings-row"><span>Larger text</span><button class="icon-btn" onclick="toggleTextLarge(); render()">${state.textLarge ? "On" : "Off"}</button></div>
    <p class="muted" style="margin-top:16px">This app avoids unnecessary animation, uses a single readable typeface throughout, and supports keyboard navigation on all buttons and links.</p>
  `;
}

function computePct() {
  const masteredCount = Object.values(state.progress).filter((s) => s === "mastered").length;
  return Math.round((masteredCount / LEVELS.length) * 100);
}

const NAV_ITEMS = [
  { key: "dashboard", label: "Learn" },
  { key: "dictionary", label: "Dictionary" },
  { key: "flashcards", label: "Flashcards" },
  { key: "sessionclock", label: "Session Clock" },
  { key: "backtest", label: "Chart Lab" },
  { key: "journal", label: "Journal" },
  { key: "risk", label: "Risk Tools" },
  { key: "instruments", label: "Instruments" },
  { key: "dailyintro", label: "Daily Practice" },
  { key: "certintro", label: "Certification" },
  { key: "settings", label: "Settings" },
];

function render() {
  const pct = computePct();
  let body = "";
  if (state.view === "dashboard") body = renderDashboard();
  else if (state.view === "lesson") body = renderLesson();
  else if (state.view === "quiz") body = `<button class="back-btn" onclick="backToLesson()">← Back to lesson</button>${renderQuiz()}`;
  else if (state.view === "result") body = renderResult();
  else if (state.view === "flashcards") body = renderFlashcards();
  else if (state.view === "dictionary") body = renderDictionary();
  else if (state.view === "sessionclock") body = renderSessionClock();
  else if (state.view === "journal") body = renderJournal();
  else if (state.view === "backtest") body = renderBacktest();
  else if (state.view === "risk") body = renderRiskTools();
  else if (state.view === "instruments") body = renderInstruments();
  else if (state.view === "dailyintro") body = renderDailyIntro();
  else if (state.view === "daily") body = renderDaily();
  else if (state.view === "certintro") body = renderCertIntro();
  else if (state.view === "cert") body = renderCert();
  else if (state.view === "settings") body = renderSettings();

  const navHtml = NAV_ITEMS.map((n) => {
    const isActive = state.view === n.key || (n.key === "dashboard" && (state.view === "lesson" || state.view === "quiz" || state.view === "result"));
    return `<button class="nav-btn ${isActive ? "active" : ""}" onclick="goNav('${n.key}')">${esc(n.label)}</button>`;
  }).join("");

  document.getElementById("root").innerHTML = `
    <div class="app">
      <header class="header">
        <div>
          <div class="brand-row"><span class="brand-mark">ICT</span><span class="brand-name">Trading Academy</span></div>
          <div class="progress-row">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <span class="progress-label">${pct}% of the course mastered</span>
          </div>
        </div>
        <div class="header-controls">
          <div class="mode-toggle">
            <button class="mode-btn ${state.mode === "normal" ? "active" : ""}" onclick="setMode('normal')">Normal</button>
            <button class="mode-btn ${state.mode === "simple" ? "active" : ""}" onclick="setMode('simple')">Super Simple</button>
          </div>
        </div>
      </header>
      <nav class="nav">${navHtml}</nav>
      <main class="main">${body}</main>
      <footer class="footer">Educational content only — nothing here is financial advice or a guaranteed signal.</footer>
    </div>
  `;
}

render();
</script>
</body>
</html>
