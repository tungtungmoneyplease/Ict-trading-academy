<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ICT Trading Academy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');
  * { box-sizing: border-box; font-family: 'Atkinson Hyperlegible', sans-serif; margin: 0; padding: 0; }
  body { background: #FAFAF7; color: #1B1D1F; }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; opacity: 0.5; }
  .app { min-height: 100vh; display: flex; flex-direction: column; }

  .header { padding: 20px 24px 14px; border-bottom: 1px solid #E4E1D8; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; }
  .brand-row { display: flex; align-items: baseline; gap: 8px; }
  .brand-mark { background: #2F4FD1; color: #fff; font-weight: 700; font-size: 13px; padding: 3px 7px; border-radius: 4px; letter-spacing: 0.5px; }
  .brand-name { font-weight: 700; font-size: 19px; }
  .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .progress-track { width: 160px; height: 6px; background: #EDEAE0; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: #2F4FD1; transition: width 0.3s ease; }
  .progress-label { font-size: 13px; color: #5B5F63; }
  .mode-toggle { display: flex; border: 1px solid #E4E1D8; border-radius: 6px; overflow: hidden; }
  .mode-btn { padding: 8px 14px; background: #fff; border: none; font-size: 13px; color: #5B5F63; }
  .mode-btn.active { background: #EEF1FD; color: #2F4FD1; font-weight: 700; }

  .nav { display: flex; gap: 4px; padding: 10px 24px; border-bottom: 1px solid #E4E1D8; }
  .nav-btn { padding: 8px 14px; background: transparent; border: none; font-size: 14px; color: #5B5F63; border-radius: 6px; }
  .nav-btn.active { background: #1B1D1F; color: #fff; font-weight: 700; }

  .main { flex: 1; padding: 24px; max-width: 720px; width: 100%; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .muted { color: #5B5F63; line-height: 1.5; margin: 0 0 18px; }

  .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .level-card { text-align: left; background: #fff; border: 1px solid #E4E1D8; border-radius: 8px; padding: 16px; position: relative; }
  .level-card.locked { background: #F3F2EC; color: #9B978A; cursor: default; }
  .level-num { font-size: 12px; color: #9B978A; margin-bottom: 4px; }
  .level-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .level-tagline { font-size: 13px; color: #5B5F63; }
  .coming-soon { font-size: 11px; color: #9B978A; margin-top: 6px; font-style: italic; }
  .status-dot-row { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #5B5F63; margin-top: 10px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .back-btn { background: none; border: none; color: #2F4FD1; font-size: 14px; padding: 0; margin-bottom: 16px; font-weight: 700; display: block; }

  .concept-card { border: 1px solid #E4E1D8; border-radius: 8px; padding: 18px; margin-bottom: 16px; background: #fff; }
  .concept-term { margin: 0 0 8px; font-size: 18px; }
  .concept-body { margin: 0 0 10px; line-height: 1.55; }
  .easier-btn { background: none; border: 1px solid #2F4FD1; color: #2F4FD1; border-radius: 6px; padding: 6px 12px; font-size: 13px; margin-bottom: 12px; }
  .easier-box { background: #EEF1FD; border-radius: 6px; padding: 12px; margin-bottom: 12px; font-size: 14px; }
  .easier-label { font-weight: 700; font-size: 12px; color: #2F4FD1; margin-bottom: 4px; }
  .sub-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .sub-box { background: #F6F5F0; border-radius: 6px; padding: 10px; }
  .sub-label { font-size: 11px; font-weight: 700; color: #5B5F63; margin-bottom: 4px; }
  .sub-text { font-size: 13.5px; margin: 0; line-height: 1.45; }
  .mistake-box { background: #FBF2E4; border-radius: 6px; padding: 10px; border: 1px solid #EED9AE; }
  .mistake-label { font-size: 11px; font-weight: 700; color: #8A4B12; margin-bottom: 4px; }

  .interactive-box { border: 1px solid #E4E1D8; border-radius: 8px; padding: 18px; margin-bottom: 16px; background: #fff; }
  .interactive-title { font-weight: 700; margin-bottom: 10px; font-size: 14px; }
  .readout { margin-top: 10px; font-size: 14px; min-height: 20px; }
  .row-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .small-btn { background: #2F4FD1; color: #fff; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13.5px; }
  .small-btn-ghost { background: #fff; color: #1B1D1F; border: 1px solid #E4E1D8; border-radius: 6px; padding: 8px 14px; font-size: 13.5px; }
  .primary-btn { background: #1B1D1F; color: #fff; border: none; border-radius: 6px; padding: 12px 20px; font-size: 15px; font-weight: 700; margin-top: 8px; }

  .quiz-wrap { border: 1px solid #E4E1D8; border-radius: 8px; padding: 20px; background: #fff; }
  .quiz-progress { font-size: 12px; color: #9B978A; font-weight: 700; }
  .quiz-option { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border-radius: 6px; border: 1px solid #E4E1D8; font-size: 14.5px; background: #fff; }
  .quiz-option.correct { background: #EAF6EE; border-color: #1E8E5A; }
  .quiz-option.incorrect { background: #FBEAEA; border-color: #C23B3B; }
  .quiz-explain { background: #F6F5F0; border-radius: 6px; padding: 12px; font-size: 14px; margin: 10px 0; line-height: 1.5; }

  .result-box { border: 1px solid #E4E1D8; border-radius: 8px; padding: 22px; background: #fff; }

  .flash-outer { border: 1px solid #E4E1D8; border-radius: 10px; padding: 40px 20px; text-align: center; background: #fff; cursor: pointer; min-height: 140px; display: flex; flex-direction: column; justify-content: center; }
  .flash-label { font-size: 12px; color: #9B978A; font-weight: 700; margin-bottom: 10px; }
  .flash-text { font-size: 20px; font-weight: 700; line-height: 1.4; }

  .footer { text-align: center; padding: 16px; font-size: 12px; color: #9B978A; border-top: 1px solid #E4E1D8; }

  svg circle, svg g { cursor: pointer; }
</style>
</head>

<script>
/* ---------------------------------------------------------
   ICT Trading Academy — core learning slice (vanilla JS)

--------------------------------------------------------- */

const LEVELS = [
  { id: 0, title: "Trading Basics", tagline: "What trading even is", built: true },
  { id: 1, title: "Reading Candles", tagline: "One candle at a time", built: true },
  { id: 2, title: "Timeframes", tagline: "Zooming in and out", built: false },
  { id: 3, title: "Market Structure", tagline: "Highs, lows, and trend", built: true },
  { id: 4, title: "Liquidity", tagline: "Where orders cluster", built: true },
  { id: 5, title: "Fair Value Gaps", tagline: "Gaps candles leave behind", built: false },
  { id: 6, title: "Order Blocks", tagline: "Where big moves start", built: false },
  { id: 7, title: "Premium & Discount", tagline: "Expensive vs. cheap", built: false },
];

const CONCEPTS = {
  0: [
    { term: "Market", normal: "A market is a place — usually digital now — where people buy and sell things, like company shares, currencies, or contracts.", simple: "A market is where buying and selling happens.", easier: "Think of a farmer's market, but instead of vegetables, people trade money, shares, and contracts.", example: "The stock market is where shares of companies like Apple are bought and sold.", lookFor: "Every market has a price that moves because people are buying and selling.", mistake: "Thinking 'the market' is one single place — it's really thousands of buyers and sellers agreeing on a price." },
    { term: "Bid, Ask & Spread", normal: "The bid is the highest price a buyer will pay. The ask is the lowest price a seller will accept. The spread is the gap between them.", simple: "Bid = what buyers offer. Ask = what sellers want. Spread = the small gap between the two.", easier: "It's like a garage sale: you offer $5 (bid), the seller wants $7 (ask). The $2 gap is the spread.", example: "If the bid is $100.00 and the ask is $100.02, the spread is $0.02.", lookFor: "A tighter spread usually means it's cheaper and easier to trade that market.", mistake: "Forgetting the spread is a small cost every time you enter and exit a trade." },
    { term: "Long vs. Short", normal: "Going long means buying first, hoping the price rises so you can sell later for more. Going short means selling first (often borrowed), hoping the price falls so you can buy it back cheaper.", simple: "Long = betting price goes up. Short = betting price goes down.", easier: "Long is like buying a house hoping it's worth more later. Short is more unusual: it's like selling something you borrowed, planning to buy it back cheaper.", example: "If you go long at $50 and price rises to $60, you gained $10 per unit.", lookFor: "Ask yourself: am I expecting price to go up (long) or down (short)?", mistake: "Assuming you can only make money when prices rise — shorting exists for falling prices too." },
    { term: "Stop Loss & Take Profit", normal: "A stop loss automatically closes a losing trade at a price you choose, to limit how much you can lose. A take profit automatically closes a winning trade at a price you choose, to lock in gains.", simple: "Stop loss = your 'exit if I'm wrong' price. Take profit = your 'exit if I'm right' price.", easier: "It's like setting a timer before you start something risky — one timer says 'stop if this goes badly,' the other says 'stop, I got what I wanted.'", example: "You buy at $100, set a stop loss at $95 and a take profit at $115.", lookFor: "A trade plan should have both defined before you ever enter.", mistake: "Entering a trade without deciding your stop loss first — this is one of the most common beginner mistakes." },
    { term: "Risk / Reward", normal: "Risk/reward compares how much you could lose to how much you could gain on a trade, usually written like 1:2 or 1:3.", simple: "It answers: 'if I'm wrong, how much do I lose — and if I'm right, how much do I gain?'", easier: "Would you risk $1 to possibly win $3? That's a 1:3 risk/reward — a good deal even if you're wrong sometimes.", example: "Risking $50 to potentially make $150 is a risk/reward ratio of 1:3.", lookFor: "A good risk/reward ratio can still lose money overall if used carelessly — it's one factor, not a guarantee.", mistake: "Believing a good risk/reward ratio means a trade is guaranteed to work out." },
    { term: "Leverage", normal: "Leverage lets you control a larger position than your own money would normally allow, by effectively borrowing the rest. It multiplies both gains and losses.", simple: "Leverage = trading 'bigger' than your own money, which makes wins bigger and losses bigger too.", easier: "Imagine lifting a heavy box with a lever — it's easier to move, but if it swings the wrong way, it swings harder too.", example: "With 10x leverage, a 1% price move changes your position value by about 10%.", lookFor: "Higher leverage means smaller price moves can wipe out more of your account.", mistake: "Using high leverage without adjusting position size — this is a leading cause of large, fast losses." },
  ],
  1: [
    { term: "Open, High, Low, Close (OHLC)", normal: "Every candle records four prices for its time period: the Open (first price), High (highest price), Low (lowest price), and Close (last price).", simple: "Each candle stores 4 numbers: where it started, its highest point, its lowest point, and where it ended.", easier: "Think of a candle as a tiny diary entry for a chunk of time: 'I started here, went up to here, dipped down to here, and ended here.'", example: "A 1-hour candle with open 100, high 108, low 98, close 104 tells you the full story of that hour.", lookFor: "The close relative to the open tells you the candle's overall direction.", mistake: "Only looking at the close and ignoring the high/low — the wick often matters just as much." },
    { term: "Bullish vs. Bearish Candle", normal: "A bullish candle closes higher than it opened (price rose). A bearish candle closes lower than it opened (price fell). Color usually shows this at a glance.", simple: "Bullish = closed higher (usually green). Bearish = closed lower (usually red).", easier: "Green candle: price won the round. Red candle: price lost the round.", example: "Open 100, close 106 → bullish. Open 100, close 94 → bearish.", lookFor: "A string of bullish candles in a row often signals buyers are in control for now.", mistake: "Assuming one bullish candle means the price will keep rising — a single candle is not a trend." },
    { term: "Wick vs. Body", normal: "The body is the thick part between open and close. The wicks (or shadows) are the thin lines above and below showing the full high-to-low range.", simple: "Body = open to close. Wick = the thin lines showing the extremes reached.", easier: "The body is the 'main story.' The wicks are like footnotes showing how far price wandered before settling down.", example: "A long lower wick means price dropped sharply, then recovered before the candle closed.", lookFor: "Long wicks can show rejection — price tried to go somewhere and got pushed back.", mistake: "Ignoring wicks entirely and only reading the body." },
    { term: "Timeframe", normal: "A timeframe is how much real time one candle represents — for example, 1 minute, 15 minutes, 1 hour, or 1 day.", simple: "Timeframe = how much time is packed into one candle.", easier: "A daily candle is like a whole day summarized in one shape. A 1-minute candle is like a single sentence from that day.", example: "On a 1-hour chart, each candle summarizes 60 minutes of price action.", lookFor: "Higher timeframes (daily, 4-hour) tend to show broader context; lower timeframes show more detail and more noise.", mistake: "Trying to read a 1-minute chart before understanding the bigger picture on a higher timeframe." },
  ],
  3: [
    { term: "Swing High & Swing Low", normal: "A swing high is a candle's high point that is higher than the candles immediately around it. A swing low is a low point that is lower than the candles immediately around it.", simple: "Swing high = a clear peak. Swing low = a clear dip.", easier: "Picture a mountain range from far away — the tips of the peaks are swing highs, the bottoms of the valleys are swing lows.", example: "If price rises, then pulls back, then rises again, the top of that first rise is a swing high.", lookFor: "Swing points are the building blocks for reading trend and structure.", mistake: "Marking every small wiggle as a swing point instead of the clear, obvious ones." },
    { term: "Higher Highs / Higher Lows (Trend)", normal: "A series of higher highs and higher lows generally describes an uptrend. Lower highs and lower lows generally describe a downtrend.", simple: "Peaks and dips both climbing = uptrend. Peaks and dips both falling = downtrend.", easier: "Uptrend is like climbing stairs — each step (and each landing) is higher than the last.", example: "Swing lows at 100, then 105, then 110 — each low is higher than the last, suggesting an uptrend.", lookFor: "A trend is a pattern across several swing points, not just one.", mistake: "Calling a trend after seeing just one higher high, without a higher low to confirm it." },
    { term: "Break of Structure (BOS)", normal: "A break of structure happens when price closes beyond a prior swing high (in an uptrend) or swing low (in a downtrend), suggesting the existing trend is continuing.", simple: "BOS = price breaks past the last important peak or dip, in the direction it was already going.", easier: "If someone kept beating their own personal best in a race, each new record is like a 'break of structure' in their favor.", example: "In an uptrend, price closing above the last swing high is a bullish break of structure.", lookFor: "A break of structure is often used as a clue that the current trend is still active.", mistake: "Confusing a break of structure (trend continuing) with a market structure shift (trend possibly reversing)." },
    { term: "Market Structure Shift (MSS)", normal: "A market structure shift happens when price breaks structure in the opposite direction of the current trend, suggesting the trend may be changing.", simple: "MSS = a clue the trend might be flipping.", easier: "If someone walking north suddenly turns and starts walking south, that turn is like an MSS.", example: "In a downtrend, price breaking above a recent swing high could be an early sign of a market structure shift.", lookFor: "An MSS is a signal to pay closer attention, not proof the trend has reversed for good.", mistake: "Treating every small structure shift as a guaranteed full reversal." },
  ],
  4: [
    { term: "Liquidity", normal: "Liquidity refers to clusters of resting orders — like stop losses and pending orders — that tend to build up around obvious price levels.", simple: "Liquidity = a pool of orders sitting around obvious price levels.", easier: "Imagine a pool of orders sitting just above a recent high, like puddles collecting at the bottom of a hill. Price sometimes 'drains' through them.", example: "Many traders place stop losses just above a recent high — that cluster of orders is liquidity.", lookFor: "Obvious, easy-to-spot highs and lows are exactly where liquidity tends to build up.", mistake: "Assuming liquidity is a signal by itself — it only matters in how price reacts around it." },
    { term: "Buy-Side & Sell-Side Liquidity (BSL/SSL)", normal: "Buy-side liquidity (BSL) tends to sit above recent highs. Sell-side liquidity (SSL) tends to sit below recent lows.", simple: "BSL = above recent highs. SSL = below recent lows.", easier: "Highs act like a ceiling with orders resting just above it (BSL). Lows act like a floor with orders resting just below it (SSL).", example: "A recent swing high often has buy-side liquidity resting just above it.", lookFor: "Ask: where are the obvious highs and lows that other traders would also notice?", mistake: "Only ever looking for liquidity above price and forgetting to check below, or vice versa." },
    { term: "Equal Highs / Equal Lows", normal: "When price touches the same high (or low) more than once, it creates equal highs (or lows) — an especially obvious liquidity magnet.", simple: "Equal highs/lows = the same level touched more than once.", easier: "It's like two arrows landing on the exact same spot on a dartboard — that spot stands out.", example: "If price touches 150 twice without breaking through, those are equal highs.", lookFor: "Equal highs/lows are some of the easiest liquidity levels to spot on a chart.", mistake: "Assuming equal highs must break immediately — timing still matters." },
    { term: "Liquidity Sweep", normal: "A liquidity sweep is when price briefly pushes through an obvious high or low, likely triggering orders resting there, and then potentially reverses.", simple: "A sweep is a quick push through a level to trigger orders, that may then reverse.", easier: "Like a wave that rushes just past the sandcastle line, grabs a few pebbles, then pulls back.", example: "Price spikes 5 points above a recent high, then reverses sharply — a possible liquidity sweep.", lookFor: "A sweep alone is not proof of a reversal — it's a clue to watch closely, not a signal to act alone.", mistake: "Treating every sweep as a guaranteed reversal signal — sometimes price keeps going." },
  ],
};

  ],

    { q: '"Liquidity" in this context refers to:', options: ["Clusters of resting orders near obvious price levels", "How fast a candle forms", "The total number of traders online", "A type of indicator"], correct: 0, explain: "Liquidity here means pools of orders — like stops — sitting around obvious levels." },

const state = {
  mode: "normal",
  view: "dashboard",
  activeLevel: null,
  progress: { 0: "unlocked" },
  result: null,
  easierOpen: {},
  candleSelected: null,
  structureSelected: [],
  structureChecked: false,
  quiz: { index: 0, picked: null, showExplain: false, score: 0 },
  flash: { queue: FLASHCARDS.map((_, i) => i), pos: 0, flipped: false },
};

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function statusFor(level) {
  if (state.progress[level.id]) return state.progress[level.id];
  const idx = LEVELS.findIndex((l) => l.id === level.id);
  const prev = LEVELS[idx - 1];
  if (!prev) return "unlocked";
  return state.progress[prev.id] === "mastered" ? "unlocked" : "locked";
}

function dotColor(status) {
  return status === "mastered" ? "#1E8E5A" : status === "unlocked" ? "#C77F17" : "#B8B4A6";
}
function statusLabel(status) {
  return status === "mastered" ? "Mastered" : status === "unlocked" ? "Learning" : "Locked";
}

/* ------------------------------- actions ------------------------------- */

function setMode(m) { state.mode = m; render(); }

function openLevel(id) {
  const level = LEVELS.find((l) => l.id === id);
  const status = statusFor(level);
  if (status === "locked") return;
  state.activeLevel = id;
  state.easierOpen = {};
  state.view = level.built ? "lesson" : "soon";
  render();
}

function backToDashboard() { state.view = "dashboard"; render(); }
function backToLesson() { state.view = "lesson"; render(); }

function toggleEasier(key) {
  state.easierOpen[key] = !state.easierOpen[key];
  render();
}

function selectCandle(i) { state.candleSelected = i; render(); }

function toggleStructurePoint(i) {
  if (state.structureChecked) return;
  const idx = state.structureSelected.indexOf(i);
  if (idx === -1) state.structureSelected.push(i);
  else state.structureSelected.splice(idx, 1);
  render();
}
function checkStructure() { state.structureChecked = true; render(); }
function retryStructure() { state.structureChecked = false; state.structureSelected = []; render(); }

function startQuiz() {
  state.quiz = { index: 0, picked: null, showExplain: false, score: 0 };
  state.view = "quiz";
  render();
}

function quizChoose(idx) {
  const q = QUIZZES[state.activeLevel][state.quiz.index];
  if (state.quiz.showExplain) return;
  state.quiz.picked = idx;
  state.quiz.showExplain = true;
  if (idx === q.correct) state.quiz.score += 1;
  render();
}

function quizNext() {
  const questions = QUIZZES[state.activeLevel];
  if (state.quiz.index + 1 < questions.length) {
    state.quiz.index += 1;
    state.quiz.picked = null;
    state.quiz.showExplain = false;
    render();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  const total = QUIZZES[state.activeLevel].length;
  const score = state.quiz.score;
  const passed = score / total >= 0.8;
  state.progress[state.activeLevel] = passed ? "mastered" : "unlocked";
  state.result = { score, total, passed };
  state.view = "result";
  render();
}

function flipFlashcard() { state.flash.flipped = !state.flash.flipped; render(); }

function flashRate(level) {
  const f = state.flash;
  const cardIdx = f.queue[f.pos % f.queue.length];
  const insertAt = level === "hard" ? f.pos + 3 : level === "medium" ? f.pos + 6 : f.queue.length;
  const newQueue = f.queue.slice();
  newQueue.splice(f.pos, 1);
  const clamped = Math.min(insertAt, newQueue.length);
  newQueue.splice(clamped, 0, cardIdx);
  f.queue = newQueue;
  f.flipped = false;
  f.pos = (f.pos + 1) % Math.max(newQueue.length, 1);
  render();
}

function goNav(view) { state.view = view; render(); }

/* ------------------------------- rendering ------------------------------- */

function renderConceptCard(concept, levelId, i) {
  const key = levelId + "-" + i;
  const isOpen = !!state.easierOpen[key];
  const bodyText = state.mode === "simple" ? concept.simple : concept.normal;
  return `
    <div class="concept-card">
      <h3 class="concept-term">${esc(concept.term)}</h3>
      <p class="concept-body">${esc(bodyText)}</p>
      ${isOpen ? `
        <div class="easier-box">
          <div class="easier-label">Even easier</div>
          <p>${esc(concept.easier)}</p>
        </div>` : ""}
      <button class="easier-btn" onclick="toggleEasier('${key}')">${isOpen ? "Hide the easier version" : "Explain this even easier"}</button>
      <div class="sub-row">
        <div class="sub-box">
          <div class="sub-label">Example</div>
          <p class="sub-text">${esc(concept.example)}</p>
        </div>
        <div class="sub-box">
          <div class="sub-label">What to look for</div>
          <p class="sub-text">${esc(concept.lookFor)}</p>
        </div>
      </div>
      <div class="mistake-box">
        <div class="mistake-label">Common mistake</div>
        <p class="sub-text">${esc(concept.mistake)}</p>
      </div>
    </div>
  `;
}

function renderCandleChart() {
  const minP = Math.min(...CANDLES.map((c) => c.l)) - 3;
  const maxP = Math.max(...CANDLES.map((c) => c.h)) + 3;
  const scaleY = (p) => 190 - ((p - minP) / (maxP - minP)) * 180;
  const width = 340;
  const gap = width / CANDLES.length;

  const svgParts = CANDLES.map((c, i) => {
    const cx = gap * i + gap / 2;
    const isUp = c.c >= c.o;
    const bodyTop = scaleY(Math.max(c.o, c.c));
    const bodyBottom = scaleY(Math.min(c.o, c.c));
    const isSel = state.candleSelected === i;
    const color = isUp ? "#1E8E5A" : "#C23B3B";
    return `
      <g onclick="selectCandle(${i})">
        <line x1="${cx}" x2="${cx}" y1="${scaleY(c.h)}" y2="${scaleY(c.l)}" stroke="${color}" stroke-width="${isSel ? 2.5 : 1.5}" />
        <rect x="${cx - 12}" y="${bodyTop}" width="24" height="${Math.max(bodyBottom - bodyTop, 2)}" fill="${color}" opacity="${isSel ? 1 : 0.85}" stroke="${isSel ? "#2F4FD1" : "none"}" stroke-width="2" />
      </g>
    `;
  }).join("");

  let readout = `<span style="color:#5B5F63">No candle selected yet.</span>`;
  if (state.candleSelected !== null) {
    const c = CANDLES[state.candleSelected];
    const dir = c.c >= c.o ? "Bullish" : "Bearish";
    const dirColor = c.c >= c.o ? "#1E8E5A" : "#C23B3B";
    readout = `<span><strong>Candle ${state.candleSelected + 1}:</strong> Open ${c.o} · High ${c.h} · Low ${c.l} · Close ${c.c} — <strong style="color:${dirColor}">${dir}</strong></span>`;
  }

  return `
    <div class="interactive-box">
      <div class="interactive-title">Tap a candle to read its OHLC</div>
      <svg width="100%" viewBox="0 0 ${width} 200" style="max-width:400px">${svgParts}</svg>
      <div class="readout">${readout}</div>
    </div>
  `;
}

function renderStructureChart() {
  const checked = state.structureChecked;
  const selected = state.structureSelected;

  const pointColor = (i, type) => {
    if (!checked) return selected.includes(i) ? "#2F4FD1" : type === "high" ? "#B8B4A6" : "#DCE0EA";
    const isCorrectHigh = CORRECT_HIGH_INDICES.includes(i);
    const wasSelected = selected.includes(i);
    if (isCorrectHigh && wasSelected) return "#1E8E5A";
    if (isCorrectHigh && !wasSelected) return "#C77F17";
    if (!isCorrectHigh && wasSelected) return "#C23B3B";
    return "#DCE0EA";
  };

  const pathD = STRUCTURE_POINTS.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");

  const circles = STRUCTURE_POINTS.map((p, i) => {
    const isStart = p.type === "start";
    const fill = isStart ? "#C9C6BA" : pointColor(i, p.type);
    return `<circle cx="${p.x}" cy="${p.y}" r="${isStart ? 5 : 9}" fill="${fill}" stroke="#1B1D1F" stroke-width="${isStart ? 0 : 1}" ${isStart ? "" : `onclick="toggleStructurePoint(${i})"`} />`;
  }).join("");

  const allCorrect = checked &&
    CORRECT_HIGH_INDICES.every((i) => selected.includes(i)) &&
    selected.every((i) => CORRECT_HIGH_INDICES.includes(i));

  let feedback = "";
  if (checked) {
    feedback = allCorrect
      ? `<div class="readout"><span style="color:#1E8E5A">Exactly right — those are the swing highs.</span></div>`
      : `<div class="readout"><span style="color:#8A4B12">Not quite. Green = correct pick, gold = a swing high you missed, red = not actually a swing high.</span></div>`;
  }

  return `
    <div class="interactive-box">
      <div class="interactive-title">Click every swing high, then check your answer</div>
      <svg width="100%" viewBox="0 0 360 200" style="max-width:400px">
        <path d="${pathD}" fill="none" stroke="#C9C6BA" stroke-width="2" />
        ${circles}
      </svg>
      <div class="row-btns">
        <button class="small-btn" onclick="checkStructure()" ${checked ? "disabled" : ""}>Check answer</button>
        ${checked ? `<button class="small-btn-ghost" onclick="retryStructure()">Try again</button>` : ""}
      </div>
      ${feedback}
    </div>
  `;
}

function renderQuiz() {
  const questions = QUIZZES[state.activeLevel];
  const q = questions[state.quiz.index];
  const picked = state.quiz.picked;
  const showExplain = state.quiz.showExplain;

  const options = q.options.map((opt, idx) => {
    let cls = "quiz-option";
    if (showExplain) {
      if (idx === q.correct) cls += " correct";
      else if (idx === picked) cls += " incorrect";
    }
    return `<button class="${cls}" onclick="quizChoose(${idx})">${esc(opt)}</button>`;
  }).join("");

  return `
    <div class="quiz-wrap">
      <div class="quiz-progress">Question ${state.quiz.index + 1} of ${questions.length}</div>
      <h3 style="margin-top:8px">${esc(q.q)}</h3>
      <div>${options}</div>
      ${showExplain ? `<div class="quiz-explain">${picked === q.correct ? "Correct. " : "That's okay — let's look again. "}${esc(q.explain)}</div>` : ""}
      ${showExplain ? `<button class="small-btn" onclick="quizNext()">${state.quiz.index + 1 < questions.length ? "Next question" : "See results"}</button>` : ""}
    </div>
  `;
}

function renderFlashcards() {
  const f = state.flash;
  const cardIdx = f.queue[f.pos % f.queue.length];
  const card = FLASHCARDS[cardIdx];
  return `
    <h1>Flashcards</h1>
    <p class="muted">Cards you mark "Hard" come back sooner. There are ${FLASHCARDS.length} terms in this deck so far.</p>
    <div class="flash-outer" onclick="flipFlashcard()">
      <div class="flash-label">${f.flipped ? "Definition" : "Term"} · tap to flip</div>
      <div class="flash-text">${esc(f.flipped ? card.back : card.front)}</div>
    </div>
    ${f.flipped ? `
      <div class="row-btns">
        <button class="small-btn" style="background:#C23B3B" onclick="flashRate('hard')">Hard</button>
        <button class="small-btn" style="background:#C77F17" onclick="flashRate('medium')">Medium</button>
        <button class="small-btn" style="background:#1E8E5A" onclick="flashRate('easy')">Easy</button>
      </div>` : ""}
  `;
}

function renderDashboard() {
  const cards = LEVELS.map((level) => {
    const status = statusFor(level);
    const locked = status === "locked";
    return `
      <button class="level-card ${locked ? "locked" : ""}" onclick="openLevel(${level.id})" ${locked ? "disabled" : ""}>
        <div class="level-num">Level ${level.id}</div>
        <div class="level-title">${esc(level.title)}</div>
        <div class="level-tagline">${esc(level.tagline)}</div>
        <div class="status-dot-row"><span class="status-dot" style="background:${dotColor(status)}"></span>${statusLabel(status)}</div>
        ${!level.built ? `<div class="coming-soon">Coming soon</div>` : ""}
      </button>
    `;
  }).join("");

  return `
    <h1>Course</h1>
    <p class="muted">Work through each level in order. You need 80% on a quiz to unlock the next one.</p>
    <div class="level-grid">${cards}</div>
  `;
}

function renderLesson() {
  const level = LEVELS.find((l) => l.id === state.activeLevel);
  const concepts = CONCEPTS[state.activeLevel].map((c, i) => renderConceptCard(c, state.activeLevel, i)).join("");
  let interactive = "";
  if (state.activeLevel === 1) interactive = renderCandleChart();
  if (state.activeLevel === 3) interactive = renderStructureChart();

  return `
    <button class="back-btn" onclick="backToDashboard()">← Back to course</button>
    <h1>Level ${level.id} — ${esc(level.title)}</h1>
    ${concepts}
    ${interactive}
    <button class="primary-btn" onclick="startQuiz()">Take the Level ${level.id} quiz</button>
  `;
}

function renderSoon() {
  const level = LEVELS.find((l) => l.id === state.activeLevel);
  return `
    <button class="back-btn" onclick="backToDashboard()">← Back to course</button>
    <h1>${esc(level.title)}</h1>
    <p class="muted">This lesson is still being built. For now, try the levels that are already open.</p>
  `;
}

function renderResult() {
  const r = state.result;
  return `
    <div class="result-box">
      <h1>${r.passed ? "Level mastered" : "Not quite yet"}</h1>
      <p class="muted">You scored ${r.score} of ${r.total} (${Math.round((r.score / r.total) * 100)}%).</p>
      <p class="muted">${r.passed ? "The next level is now unlocked." : "You need 80% to unlock the next level. Review the lesson and try again — there's no limit on attempts."}</p>
      <div class="row-btns">
        <button class="primary-btn" onclick="backToLesson()">Review lesson</button>
        <button class="small-btn-ghost" onclick="backToDashboard()">Back to course</button>
      </div>
    </div>
  `;
}

function computePct() {
  const masteredCount = Object.values(state.progress).filter((s) => s === "mastered").length;
  const builtCount = LEVELS.filter((l) => l.built).length;
  return Math.round((masteredCount / builtCount) * 100);
}

function render() {
  const pct = computePct();
  let body = "";
  if (state.view === "dashboard") body = renderDashboard();
  else if (state.view === "lesson") body = renderLesson();
  else if (state.view === "soon") body = renderSoon();
  else if (state.view === "quiz") body = `<button class="back-btn" onclick="backToLesson()">← Back to lesson</button>${renderQuiz()}`;
  else if (state.view === "result") body = renderResult();
  else if (state.view === "flashcards") body = renderFlashcards();

  document.getElementById("root").innerHTML = `
    <div class="app">
      <header class="header">
        <div>
          <div class="brand-row">
            <span class="brand-mark">ICT</span>
            <span class="brand-name">Trading Academy</span>
          </div>
          <div class="progress-row">
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <span class="progress-label">${pct}% of the course mastered</span>
          </div>
        </div>
        <div class="mode-toggle">
          <button class="mode-btn ${state.mode === "normal" ? "active" : ""}" onclick="setMode('normal')">Normal</button>
          <button class="mode-btn ${state.mode === "simple" ? "active" : ""}" onclick="setMode('simple')">Super Simple</button>
        </div>
      </header>
      <nav class="nav">
        <button class="nav-btn ${state.view !== "flashcards" ? "active" : ""}" onclick="goNav('dashboard')">Learn</button>
        <button class="nav-btn ${state.view === "flashcards" ? "active" : ""}" onclick="goNav('flashcards')">Flashcards</button>
      </nav>
      <main class="main">${body}</main>
      <footer class="footer">Educational content only — nothing here is financial advice or a guaranteed signal.</footer>
    </div>
  `;
}

render();
</script>
</body>
</html>
